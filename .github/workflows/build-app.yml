name: Build Aimoyu APK

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Build target"
        required: true
        default: "mobile"
        type: choice
        options:
          - mobile
          - leanback
          - all
      architecture:
        description: "CPU architecture"
        required: true
        default: "arm64"
        type: choice
        options:
          - arm64
          - armv7
          - all
      build_type:
        description: "Build type"
        required: true
        default: "test"
        type: choice
        options:
          - test
          - release
      version_name:
        description: "Optional version name override, for example 1.0.1"
        required: false
        default: ""
      version_code:
        description: "Optional positive integer version code override"
        required: false
        default: ""
      vod_url:
        description: "Optional FongMi/TVBox config URL override"
        required: false
        default: ""

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install branding dependencies
        run: python -m pip install --upgrade pillow

      - name: Grant Gradle permission
        run: chmod +x gradlew

      - name: Prepare signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.build_type }}" = "release" ] && [ -n "${KEYSTORE_BASE64}" ] && [ -n "${KEYSTORE_PASSWORD}" ] && [ -n "${KEY_ALIAS}" ]; then
            echo "${KEYSTORE_BASE64}" | base64 -d > release.keystore
            {
              echo "storeFile=${GITHUB_WORKSPACE}/release.keystore"
              echo "keyAlias=${KEY_ALIAS}"
              echo "storePassword=${KEYSTORE_PASSWORD}"
              echo "keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            } > local.properties
            echo "SIGNING_MODE=release" >> "$GITHUB_ENV"
          else
            keytool -genkeypair \
              -keystore release.keystore \
              -storepass 12345678 \
              -keypass 12345678 \
              -alias release \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=AiMoYu Test, OU=Mobile, O=AiMoYu, L=Hong Kong, ST=Hong Kong, C=HK"
            {
              echo "storeFile=${GITHUB_WORKSPACE}/release.keystore"
              echo "keyAlias=release"
              echo "storePassword=12345678"
              echo "keyPassword=12345678"
            } > local.properties
            echo "SIGNING_MODE=test" >> "$GITHUB_ENV"
          fi

      - name: Build APKs
        run: |
          set -euo pipefail
          declare -a MODES
          declare -a ABIS
          case "${{ inputs.platform }}" in
            mobile) MODES=(mobile) ;;
            leanback) MODES=(leanback) ;;
            all) MODES=(mobile leanback) ;;
          esac
          case "${{ inputs.architecture }}" in
            arm64) ABIS=(Arm64_v8a) ;;
            armv7) ABIS=(Armeabi_v7a) ;;
            all) ABIS=(Arm64_v8a Armeabi_v7a) ;;
          esac
          declare -a PROPS
          if [ -n "${{ inputs.version_name }}" ]; then PROPS+=("-PaimoyuVersionName=${{ inputs.version_name }}"); fi
          if [ -n "${{ inputs.version_code }}" ]; then PROPS+=("-PaimoyuVersionCode=${{ inputs.version_code }}"); fi
          if [ -n "${{ inputs.vod_url }}" ]; then PROPS+=("-PaimoyuVodUrl=${{ inputs.vod_url }}"); fi
          for mode in "${MODES[@]}"; do
            python scripts/apply_brand.py --mode "$mode"
            if [ "$mode" = "mobile" ]; then mode_task="Mobile"; else mode_task="Leanback"; fi
            for abi in "${ABIS[@]}"; do
              ./gradlew "assemble${mode_task}${abi}Release" --stacktrace "${PROPS[@]}"
            done
          done

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          VERSION_NAME="${{ inputs.version_name }}"
          VERSION_CODE="${{ inputs.version_code }}"
          if [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ]; then
            eval "$(python - <<'PY'
import json
from pathlib import Path
brand = json.loads(Path("branding/brand.json").read_text(encoding="utf-8"))
print("BRAND_VERSION_NAME=" + str(brand.get("versionName", "1.0.0")))
print("BRAND_VERSION_CODE=" + str(brand.get("versionCode", 1)))
PY
)"
            VERSION_NAME="${VERSION_NAME:-$BRAND_VERSION_NAME}"
            VERSION_CODE="${VERSION_CODE:-$BRAND_VERSION_CODE}"
          fi
          echo "AIMOYU_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "AIMOYU_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "AIMOYU_RELEASE_TAG=aimoyu-v${VERSION_NAME}-${VERSION_CODE}" >> "$GITHUB_ENV"
          find app/build/outputs/apk -path "*/release/*.apk" -type f | while read -r apk; do
            name="$(basename "$apk")"
            if [ "${{ inputs.build_type }}" = "test" ] || [ "${SIGNING_MODE}" = "test" ]; then
              name="${name%.apk}-test.apk"
            fi
            cp "$apk" "dist/$name"
          done
          cd dist
          sha256sum *.apk > checksums.sha256
          {
            echo "{"
            echo "  \"brand\": \"AiMoYu\","
            echo "  \"platform\": \"${{ inputs.platform }}\","
            echo "  \"architecture\": \"${{ inputs.architecture }}\","
            echo "  \"buildType\": \"${{ inputs.build_type }}\","
            echo "  \"signingMode\": \"${SIGNING_MODE}\","
            echo "  \"versionName\": \"${VERSION_NAME}\","
            echo "  \"versionCode\": ${VERSION_CODE},"
            echo "  \"createdAt\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\""
            echo "}"
          } > build-info.json

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES="dist/release-notes.md"
          {
            echo "AiMoYu APK"
            echo
            echo "- Version: ${AIMOYU_VERSION_NAME} (${AIMOYU_VERSION_CODE})"
            echo "- Platform: ${{ inputs.platform }}"
            echo "- Architecture: ${{ inputs.architecture }}"
            echo "- Build type: ${{ inputs.build_type }}"
            echo "- Signing mode: ${SIGNING_MODE}"
          } > "$NOTES"
          if gh release view "$AIMOYU_RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$AIMOYU_RELEASE_TAG" --title "AiMoYu ${AIMOYU_VERSION_NAME} (${AIMOYU_VERSION_CODE})" --notes-file "$NOTES"
          else
            gh release create "$AIMOYU_RELEASE_TAG" --title "AiMoYu ${AIMOYU_VERSION_NAME} (${AIMOYU_VERSION_CODE})" --notes-file "$NOTES"
          fi
          gh release upload "$AIMOYU_RELEASE_TAG" dist/*.apk dist/checksums.sha256 dist/build-info.json --clobber

      - name: Update online manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p tv
          python - <<'PY'
import json
import os
from pathlib import Path

repo = os.environ["GITHUB_REPOSITORY"]
tag = os.environ["AIMOYU_RELEASE_TAG"]
version_name = os.environ["AIMOYU_VERSION_NAME"]
version_code = int(os.environ["AIMOYU_VERSION_CODE"])
created_at = Path("dist/build-info.json").read_text(encoding="utf-8")
created_at = json.loads(created_at).get("createdAt", "")

manifest = {
    "code": version_code,
    "name": version_name,
    "desc": "爱摸鱼影视 APP 新版本。",
    "versionCode": version_code,
    "versionName": version_name,
    "force": False,
    "description": "爱摸鱼影视 APP 新版本。",
    "publishedAt": created_at,
    "mobile": {},
    "tv": {},
}

for apk in sorted(Path("dist").glob("*.apk")):
    name = apk.name
    url = f"https://github.com/{repo}/releases/download/{tag}/{name}"
    target = "tv" if "-tv-" in name else "mobile"
    arch = "arm64" if "-arm64-" in name else "armv7"
    manifest[target][arch] = {
        "name": name,
        "url": url,
        "size": apk.stat().st_size,
    }
    if target == "mobile" and arch == "arm64":
        manifest["url"] = url

Path("tv/update.json").write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tv/update.json
          git commit -m "Update Aimoyu app update manifest" || exit 0
          git push origin HEAD:${{ github.ref_name }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aimoyu-apk
          path: dist/*
          if-no-files-found: error
