name: Build Mobile APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant Gradle permission
        run: chmod +x gradlew

      - name: Create local properties
        run: |
          cat > local.properties <<EOF
          storeFile=${{ github.workspace }}/release.keystore
          keyAlias=release
          storePassword=12345678
          EOF

      - name: Create temporary keystore
        run: |
          keytool -genkeypair \
            -keystore release.keystore \
            -storepass 12345678 \
            -keypass 12345678 \
            -alias release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Video App, OU=Mobile, O=Video, L=Taipei, ST=Taiwan, C=TW"

      - name: Build mobile ARM64 APK
        run: ./gradlew assembleMobileArm64_v8aRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mobile-arm64-apk
          path: app/build/outputs/apk/mobileArm64_v8a/release/*.apk
          if-no-files-found: error
