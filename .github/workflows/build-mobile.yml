name: Build Aimoyu APK

on:
  workflow_dispatch:
    inputs:
      vod_url:
        description: "FongMi配置地址，必须是JSON配置，不是普通网页"
        required: false
        default: "https://361123.xyz/fongmi.json"
      version_name:
        description: "版本名"
        required: true
        default: "1.0.0"
      version_code:
        description: "版本号，只能填数字"
        required: true
        default: "100"
      variant:
        description: "打包类型"
        required: true
        default: "mobile"
        type: choice
        options:
          - mobile
          - leanback
          - both

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant Gradle permission
        run: chmod +x gradlew

      - name: Create local properties
        run: |
          cat > local.properties <<EOF
          storeFile=${{ github.workspace }}/release.keystore
          keyAlias=release
          storePassword=12345678
          EOF

      - name: Create temporary keystore
        run: |
          keytool -genkeypair \
            -keystore release.keystore \
            -storepass 12345678 \
            -keypass 12345678 \
            -alias release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Video App, OU=Mobile, O=Video, L=Taipei, ST=Taiwan, C=TW"

      - name: Build mobile ARM64 APK
        if: ${{ inputs.variant == 'mobile' || inputs.variant == 'both' }}
        run: |
          ./gradlew assembleMobileArm64_v8aRelease --stacktrace \
            -PaimoyuVodUrl="${{ inputs.vod_url }}" \
            -PaimoyuVersionName="${{ inputs.version_name }}" \
            -PaimoyuVersionCode="${{ inputs.version_code }}"

      - name: Build TV ARM64 APK
        if: ${{ inputs.variant == 'leanback' || inputs.variant == 'both' }}
        run: |
          ./gradlew assembleLeanbackArm64_v8aRelease --stacktrace \
            -PaimoyuVodUrl="${{ inputs.vod_url }}" \
            -PaimoyuVersionName="${{ inputs.version_name }}" \
            -PaimoyuVersionCode="${{ inputs.version_code }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aimoyu-apk
          path: app/build/outputs/apk/**/release/*.apk
          if-no-files-found: error
