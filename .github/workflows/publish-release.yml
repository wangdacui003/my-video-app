name: Publish Aimoyu Release

on:
  workflow_run:
    workflows:
      - Build Aimoyu APK
    types:
      - completed

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Download APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "${{ github.event.workflow_run.id }}" --name aimoyu-apk --dir dist

      - name: Publish release and update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_release.py --dist dist --repo "${GITHUB_REPOSITORY}" --run-id "${{ github.event.workflow_run.id }}"

      - name: Commit update manifest
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tv/update.json
          git commit -m "Update Aimoyu app update manifest" || exit 0
          git push origin HEAD:${{ github.event.workflow_run.head_branch }}
